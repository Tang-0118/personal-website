<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:8; }
      .box-blue { fill:#eff6ff; stroke:#93c5fd; }
      .box-green { fill:#f0fdf4; stroke:#86efac; }
      .box-amber { fill:#fffbeb; stroke:#fcd34d; }
      .title { font-size:15px; font-weight:700; fill:#0f172a; }
      .sub { font-size:12px; fill:#64748b; }
      .line { stroke:#94a3b8; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .label { font-size:11.5px; fill:#475569; }
      .lane { font-size:13px; font-weight:700; fill:#334155; }
    </style>
  </defs>

  <rect width="1180" height="660" fill="#f8fafc"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">工业质检 AI Copilot · 数据流与分层</text>
  <text x="30" y="58" font-size="12.5" fill="#64748b">左边是已经在跑的生产系统，右边是新增的 AI 层；中间只通过结果文件和日志单向连接，不反向控制产线</text>

  <!-- 生产侧 -->
  <rect x="30" y="86" width="300" height="250" fill="#ffffff" stroke="#e2e8f0" rx="10"/>
  <text x="48" y="112" class="lane">生产侧（原有系统，未改动）</text>

  <rect class="box" x="52" y="130" width="256" height="46" rx="8"/>
  <text x="66" y="150" class="title">相机 + 算法</text>
  <text x="66" y="166" class="sub">红外 / 可见光，只测量不判定</text>

  <rect class="box" x="52" y="188" width="256" height="46" rx="8"/>
  <text x="66" y="208" class="title">规则引擎</text>
  <text x="66" y="224" class="sub">按 config.json 阈值判 OK / NG / UNKNOWN</text>

  <rect class="box" x="52" y="246" width="256" height="46" rx="8"/>
  <text x="66" y="266" class="title">PLC 联锁</text>
  <text x="66" y="282" class="sub">NG 剔除，Fail-Safe 锁机</text>

  <rect class="box" x="52" y="304" width="256" height="46" rx="8"/>
  <text x="66" y="324" class="title">落盘</text>
  <text x="66" y="340" class="sub">result.json / 图像 / 检测明细日志</text>

  <!-- 数据入口 -->
  <rect class="box-amber" x="370" y="150" width="170" height="86" rx="8"/>
  <text x="386" y="176" class="title">后台同步</text>
  <text x="386" y="196" class="sub">8 秒扫描一次</text>
  <text x="386" y="214" class="sub">没存图时解析日志兜底</text>

  <line class="line" x1="308" y1="327" x2="366" y2="220"/>
  <text x="286" y="300" class="label">只读</text>

  <!-- 存储 -->
  <rect class="box" x="370" y="262" width="170" height="86" rx="8"/>
  <text x="386" y="288" class="title">SQLite</text>
  <text x="386" y="308" class="sub">检测记录 + 测量值</text>
  <text x="386" y="326" class="sub">436 袋 / 90 个字段</text>

  <rect class="box" x="370" y="368" width="170" height="86" rx="8"/>
  <text x="386" y="394" class="title">知识库</text>
  <text x="386" y="414" class="sub">47 个片段</text>
  <text x="386" y="432" class="sub">项目文档 / 日志说明</text>

  <line class="line" x1="455" y1="240" x2="455" y2="258"/>

  <!-- 工具层 -->
  <rect x="580" y="86" width="250" height="368" fill="#ffffff" stroke="#e2e8f0" rx="10"/>
  <text x="598" y="112" class="lane">工具层（8 个）</text>

  <rect class="box-blue" x="600" y="130" width="210" height="34" rx="6"/>
  <text x="612" y="152" class="sub">get_inspection · 查单袋</text>
  <rect class="box-blue" x="600" y="172" width="210" height="34" rx="6"/>
  <text x="612" y="194" class="sub">list_inspections · 按结果筛</text>
  <rect class="box-blue" x="600" y="214" width="210" height="34" rx="6"/>
  <text x="612" y="236" class="sub">rank_by_metric · 按测量值排序</text>
  <rect class="box-blue" x="600" y="256" width="210" height="34" rx="6"/>
  <text x="612" y="278" class="sub">find_borderline_ng · 最接近合格</text>
  <rect class="box-blue" x="600" y="298" width="210" height="34" rx="6"/>
  <text x="612" y="320" class="sub">summarize_reasons · 原因分布</text>
  <rect class="box-blue" x="600" y="340" width="210" height="34" rx="6"/>
  <text x="612" y="362" class="sub">compare_shifts · 班次对比</text>
  <rect class="box-blue" x="600" y="382" width="210" height="34" rx="6"/>
  <text x="612" y="404" class="sub">find_consecutive_ng · 连续 NG</text>
  <rect class="box-blue" x="600" y="424" width="210" height="34" rx="6"/>
  <text x="612" y="446" class="sub">search_knowledge · 检索文档</text>

  <line class="line" x1="543" y1="305" x2="576" y2="305"/>
  <line class="line" x1="543" y1="410" x2="576" y2="410"/>

  <!-- 编排 -->
  <rect x="870" y="86" width="280" height="150" fill="#ffffff" stroke="#e2e8f0" rx="10"/>
  <text x="888" y="112" class="lane">Agent 编排</text>
  <text x="888" y="136" class="sub">① 判断意图：查一袋 / 查一批 / 算指标</text>
  <text x="888" y="156" class="sub">② 选工具、传参数</text>
  <text x="888" y="176" class="sub">③ 把结果拼成上下文</text>
  <text x="888" y="196" class="sub">④ 交模型组织语言</text>
  <text x="888" y="220" class="sub" fill="#b45309">工具失败或超时 → 本地兜底，不空转</text>

  <line class="line" x1="834" y1="160" x2="866" y2="160"/>

  <!-- 模型 -->
  <rect class="box-green" x="870" y="256" width="280" height="120" rx="10"/>
  <text x="888" y="282" class="lane">模型（可替换）</text>
  <text x="888" y="306" class="sub">本地 qwen3.5:4b / 云端 qwen3.7-flash</text>
  <text x="888" y="326" class="sub">视觉模型只判断有没有露出银边</text>
  <text x="888" y="346" class="sub" fill="#166534">模型只负责说人话，数字不经过它</text>

  <line class="line" x1="1010" y1="240" x2="1010" y2="252"/>

  <!-- 界面 -->
  <rect x="870" y="396" width="280" height="110" fill="#ffffff" stroke="#e2e8f0" rx="10"/>
  <text x="888" y="422" class="lane">界面</text>
  <text x="888" y="446" class="sub">回答 + 证据图 + 知识来源</text>
  <text x="888" y="466" class="sub">Agent 轨迹：规划 / 工具 / 耗时</text>
  <text x="888" y="486" class="sub">右上角显示当前用的哪个模型</text>

  <line class="line" x1="1010" y1="380" x2="1010" y2="392"/>

  <!-- 底部说明 -->
  <text x="30" y="520" class="lane">评测（不在这张图上跑，但决定了这套东西可信）</text>
  <text x="30" y="546" class="sub">L1 工具路由回归 221 条 · L2 语义评测 64 条（事实/多跳/案例/不可答）· L3 视觉模型 119 例人工标注</text>
  <text x="30" y="568" class="sub">当前算法在 700 例真实数据上重放：真不良检出 173/185，漏检 12 例（9 例阈值 2 例检测退化 1 例规则禁用）</text>
  <text x="30" y="600" class="sub" fill="#b45309">已知短板：知识库只有 47 个片段；本地 4B 在纯文档问答上会答偏；远程 rerank 403，实际走本地重排</text>
</svg>
